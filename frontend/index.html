<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Posts</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
    const API = "https://jsonplaceholder.typicode.com/posts";

    // Componente: uma função que devolve JSX. O nome começa sempre com maiúscula.
    // "post" chega como prop, vinda do componente pai.
    function CartaoPost({ post }) {
      return (
        <div className="card mb-3 shadow-sm">
          <div className="card-body">
            <h5 className="card-title text-capitalize">{post.title}</h5>
            <p className="card-text text-muted">{post.body}</p>
            <button className="btn btn-sm btn-outline-primary me-2">Editar</button>
            <button className="btn btn-sm btn-outline-danger">Apagar</button>
          </div>
        </div>
      );
    }

    function App() {
      // Estado: o que o componente "recorda". Mudar o estado volta a desenhar o ecrã.
      const [posts, setPosts] = useState([]);
      const [aCarregar, setACarregar] = useState(true);
      const [erro, setErro] = useState(null);

      // Efeito: corre depois do primeiro desenho. O [] final significa "só uma vez".
      useEffect(() => {
        async function carregarPosts() {
          try {
            const resposta = await fetch(API + "?_limit=6");
            if (!resposta.ok) throw new Error("Erro HTTP " + resposta.status);
            setPosts(await resposta.json());
          } catch (e) {
            setErro(e.message);
          } finally {
            setACarregar(false);
          }
        }
        carregarPosts();
      }, []);

      return (
        <div className="container py-4" style={{ maxWidth: 720 }}>
          <h1 className="h3 mb-1">Gestor de Posts</h1>
          <p className="text-muted">Aprender React, Bootstrap e APIs REST.</p>

          {aCarregar && <p className="text-muted">A carregar...</p>}
          {erro && <div className="alert alert-danger">{erro}</div>}

          {posts.map((post) => (
            <CartaoPost key={post.id} post={post} />
          ))}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
