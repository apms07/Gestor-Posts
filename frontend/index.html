<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gestor de Posts</title>
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
  <div id="root"></div>

  <script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@babel/standalone@7.25.6/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useEffect } = React;
const API = "https://jsonplaceholder.typicode.com/posts";

// Função auxiliar: todos os pedidos passam por aqui
async function pedido(url, opcoes) {
  const resposta = await fetch(url, opcoes);
  if (!resposta.ok) throw new Error("Erro HTTP " + resposta.status);
  return resposta.json();
}

function CartaoPost({ post, aEditar, aApagar }) {
  return (
    <div className="card mb-3 shadow-sm">
      <div className="card-body">
        <h5 className="card-title text-capitalize">{post.title}</h5>
        <p className="card-text text-muted">{post.body}</p>
        <button className="btn btn-sm btn-outline-primary me-2"
                onClick={() => aEditar(post)}>Editar</button>
        <button className="btn btn-sm btn-outline-danger"
                onClick={() => aApagar(post.id)}>Apagar</button>
      </div>
    </div>
  );
}

function Formulario({ postEmEdicao, aGuardar, aCancelar }) {
  const [titulo, setTitulo] = useState("");
  const [corpo, setCorpo] = useState("");

  // Quando se clica em "Editar", preenche os campos com esse post
  useEffect(() => {
    setTitulo(postEmEdicao ? postEmEdicao.title : "");
    setCorpo(postEmEdicao ? postEmEdicao.body : "");
  }, [postEmEdicao]);

  function submeter(e) {
    e.preventDefault(); // impede o browser de recarregar a página
    aGuardar({ title: titulo, body: corpo });
    setTitulo("");
    setCorpo("");
  }

  return (
    <form onSubmit={submeter} className="card card-body mb-4">
      <h5>{postEmEdicao ? "Editar post #" + postEmEdicao.id : "Novo post"}</h5>
      <input className="form-control mb-2" placeholder="Título"
             value={titulo} onChange={(e) => setTitulo(e.target.value)} required />
      <textarea className="form-control mb-2" rows="3" placeholder="Conteúdo"
                value={corpo} onChange={(e) => setCorpo(e.target.value)} required />
      <div>
        <button className="btn btn-primary me-2" type="submit">
          {postEmEdicao ? "Guardar alterações" : "Criar post"}
        </button>
        {postEmEdicao && (
          <button className="btn btn-secondary" type="button" onClick={aCancelar}>
            Cancelar
          </button>
        )}
      </div>
    </form>
  );
}

function App() {
  const [posts, setPosts] = useState([]);
  const [aCarregar, setACarregar] = useState(true);
  const [erro, setErro] = useState(null);
  const [aviso, setAviso] = useState("");
  const [postEmEdicao, setPostEmEdicao] = useState(null);

  // GET: ler a lista (uma vez, quando a página abre)
  useEffect(() => {
    pedido(API + "?_limit=6")
      .then(setPosts)
      .catch((e) => setErro(e.message))
      .finally(() => setACarregar(false));
  }, []);

  // POST: criar um recurso novo
  async function criar(dados) {
    try {
      setErro(null);
      const novo = await pedido(API, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ ...dados, userId: 1 }),
      });
      // A API devolve sempre id 101, por isso usamos um id local único
      setPosts([{ ...novo, id: Date.now() }, ...posts]);
      setAviso("Post criado (POST).");
    } catch (e) { setErro(e.message); }
  }

  // PUT: atualizar um recurso existente (o id vai na URL)
  async function atualizar(dados) {
    try {
      setErro(null);
      const id = postEmEdicao.id;
      // Posts criados localmente não existem na API, só os atualizamos no ecrã
      const atualizado = id > 100
        ? { ...postEmEdicao, ...dados }
        : await pedido(API + "/" + id, {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ...postEmEdicao, ...dados }),
          });
      setPosts(posts.map((p) => (p.id === id ? atualizado : p)));
      setPostEmEdicao(null);
      setAviso("Post atualizado (PUT).");
    } catch (e) { setErro(e.message); }
  }

  // DELETE: apagar um recurso
  async function apagar(id) {
    try {
      setErro(null);
      if (id <= 100) await pedido(API + "/" + id, { method: "DELETE" });
      setPosts(posts.filter((p) => p.id !== id));
      setAviso("Post apagado (DELETE).");
    } catch (e) { setErro(e.message); }
  }

  return (
    <div className="container py-4" style={{ maxWidth: 720 }}>
      <h1 className="h3 mb-1">Gestor de Posts</h1>
      <p className="text-muted">Aprender React, Bootstrap e APIs REST.</p>

      {erro && <div className="alert alert-danger">{erro}</div>}
      {aviso && <div className="alert alert-success py-2">{aviso}</div>}

      <Formulario
        postEmEdicao={postEmEdicao}
        aGuardar={postEmEdicao ? atualizar : criar}
        aCancelar={() => setPostEmEdicao(null)}
      />

      {aCarregar && <p className="text-muted">A carregar...</p>}

      {posts.map((post) => (
        <CartaoPost key={post.id} post={post}
                    aEditar={setPostEmEdicao} aApagar={apagar} />
      ))}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
